<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ecg {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: ecg-draw 1.2s ease-out infinite;
    }

    @keyframes ecg-draw {
      0% {
        stroke-dashoffset: 1;
        opacity: 0.35;
      }
      18% {
        opacity: 1;
      }
      70%,
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
  </style>
  <g fill="#26c2c1">
    <!-- Left vertical bar -->
    <rect x="230" y="180" width="120" height="640" rx="40" />
    <!-- Right vertical bar -->
    <rect x="650" y="180" width="120" height="640" rx="40" />
    <!-- Heartbeat line -->
    <path class="ecg" pathLength="1" d="M350 510 L430 510 L470 360 L530 660 L570 510 L650 510" stroke="#26c2c1" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
